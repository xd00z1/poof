name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --lib --no-default-features -- -D warnings
        working-directory: core
      - run: cargo test
        working-directory: core

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build Rust core for iOS
        run: cargo build --release --lib --no-default-features --target aarch64-apple-ios
        working-directory: core
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
        working-directory: ios
      - name: Build unsigned app
        run: |
          xcodebuild -project Poof.xcodeproj -scheme Poof -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" build
        working-directory: ios
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Poof.app Payload/
          zip -qry Poof.ipa Payload
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: Poof-unsigned-ipa
          path: ios/Poof.ipa

      # Mac setup app: universal Rust library + the IPA above as a resource.
      - name: Build Rust core for macOS (universal)
        run: |
          cargo build --release --lib --target aarch64-apple-darwin
          cargo build --release --lib --target x86_64-apple-darwin
          cargo build --release --bin poof --target aarch64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/libpoof_core.a \
            target/x86_64-apple-darwin/release/libpoof_core.a \
            -output target/universal-apple-darwin/release/libpoof_core.a
        working-directory: core
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - name: Build Poof Setup.app
        run: |
          mkdir -p Resources
          cp ../ios/Poof.ipa Resources/Poof.ipa
          xcodegen generate
          xcodebuild -project PoofSetup.xcodeproj -scheme PoofSetup -configuration Release \
            -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/build" build
          codesign --force --deep --sign - "build/Poof Setup.app"
          ditto -c -k --keepParent "build/Poof Setup.app" "Poof-Setup-mac.zip"
        working-directory: mac
      - uses: actions/upload-artifact@v4
        with:
          name: Poof-Setup-mac
          path: mac/Poof-Setup-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: poof-cli-macos-arm64
          path: core/target/aarch64-apple-darwin/release/poof
