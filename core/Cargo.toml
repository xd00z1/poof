[package]
name = "poof-core"
version = "0.1.0"
edition = "2024"
description = "Keep-alive location simulation engine for iOS devices (Apple's DVT LocationSimulation service)"
license = "MIT"

[lib]
name = "poof_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "poof"
path = "src/bin/poof.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
# USB setup from a Mac/PC (pairing, Developer Mode, pushing the pairing file
# into the app). The iOS library is built with --no-default-features.
desktop = [
    "idevice/usbmuxd",
    "idevice/pair",
    "idevice/amfi",
    "idevice/house_arrest",
    "dep:uuid",
    "dep:isideload",
    "dep:rustls",
    "dep:rpassword",
]

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "tcp",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "rsd",
    "dvt",
    "location_simulation",
    "heartbeat",
    "mobile_image_mounter",
    "tss",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4"], optional = true }
isideload = { version = "=0.4.5", default-features = false, features = ["install", "tokio-mt", "fs-storage"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rpassword = { version = "7", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
