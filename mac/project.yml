name: PoofSetup
options:
  bundleIdPrefix: app.poof
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PoofSetup:
    type: application
    platform: macOS
    sources:
      - path: PoofSetup
      # Copied in by CI / build script from ios/Poof.ipa; optional at build time.
      - path: Resources
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Poof Setup
        PRODUCT_BUNDLE_IDENTIFIER: app.poof.Setup
        INFOPLIST_FILE: PoofSetup/Support/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: PoofSetup/Support/PoofSetup-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
        # Universal static library produced by lipo (see README / CI).
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../core/target/universal-apple-darwin/release
        OTHER_LDFLAGS: -lpoof_core -framework Security -framework SystemConfiguration -framework CoreFoundation
        # Needs the usbmuxd socket; the App Sandbox would block it.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
