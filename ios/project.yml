name: Poof
options:
  bundleIdPrefix: app.poof
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Poof:
    type: application
    platform: iOS
    sources:
      - path: Poof
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.poof.Poof
        INFOPLIST_FILE: Poof/Support/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Poof/Support/Poof-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lpoof_core
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Rust library is built for devices only.
        SUPPORTED_PLATFORMS: iphoneos
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
